name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    # A hung test is capped here instead of by GitHub's 6-hour default. The
    # slowest cell took ~21 minutes (windows-latest, Node 22, 2026-10-22); on
    # Windows the suite has hung for 40+ minutes before (see SKIP_INSTALL_MATRIX).
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}

    strategy:
      # One platform failing does not cancel the others: the intermittent
      # macOS segfault below used to take the whole matrix down with it, and
      # the cancelled jobs told nothing about their own platforms.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # The runner image caches a Node per major; without this the job
          # runs whatever patch the image was built with, however old.
          check-latest: true
          cache: 'npm'

      - name: Show the runtime
        run: node -p "process.version + ' ' + process.platform + '-' + process.arch" && npm -v

      # --ignore-scripts: the Node 22 runner's npm 10 does not read package.json
      # `allowScripts` (nor .npmrc `strict-allow-scripts`), and no dependency's
      # install script is needed to lint, build or test — `allowScripts` denies
      # every one of them. It also skips the root's own `prepare` (husky), which
      # CI has no use for.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Biome lint
        run: npm run lint:check -- --diagnostic-level=error

      # The root step covers `src` only; every other package lints its own
      # sources.
      - name: Run Biome lint (server)
        run: npm --prefix server run lint:check

      - name: Run Biome lint (http)
        run: npm --prefix http run lint:check

      - name: Run Biome lint (sse)
        run: npm --prefix sse run lint:check

      - name: Run Biome lint (compact)
        run: npm --prefix compact run lint:check

      - name: Run Biome lint (compact-readonly-entries)
        run: npm --prefix compact-readonly-entries run lint:check

      - name: Run Biome lint (compact-modify)
        run: npm --prefix compact-modify run lint:check

      - name: Run Biome lint (background-runs-memory)
        run: npm --prefix background-runs-memory run lint:check

      - name: Run Biome lint (responsible-rules)
        run: npm --prefix responsible-rules run lint:check

      # The launch code of the three transports and its suites (19.2.0).
      - name: Run Biome lint (server-runtime)
        run: npm --prefix server-runtime run lint:check

      # Their suites run in the root `npm test` (its Jest roots name them).
      - name: Run Biome lint (compact-http)
        run: npm --prefix compact-http run lint:check

      - name: Run Biome lint (compact-sse)
        run: npm --prefix compact-sse run lint:check

      # The six read-only packages; their suites run in the root
      # `npm test` (its Jest roots name them).
      - name: Run Biome lint (core-ro)
        run: npm --prefix core-ro run lint:check

      - name: Run Biome lint (http-ro)
        run: npm --prefix http-ro run lint:check

      - name: Run Biome lint (sse-ro)
        run: npm --prefix sse-ro run lint:check

      - name: Run Biome lint (compact-ro)
        run: npm --prefix compact-ro run lint:check

      - name: Run Biome lint (compact-http-ro)
        run: npm --prefix compact-http-ro run lint:check

      - name: Run Biome lint (compact-sse-ro)
        run: npm --prefix compact-sse-ro run lint:check

      - name: Build project
        run: npm run build

      # The build compiles `src` without the tests, and Jest strips types
      # without checking them, so a test that does not type-check still runs
      # green. This step is the only place its types are checked.
      - name: Type-check tests
        run: npm run test:check

      # No `continue-on-error` here. It was on this step from the day the
      # workflow was written, so the suite ran on six platform/Node
      # combinations and its verdict was thrown away on all six: a red
      # `packageEntryPoints` sat inside green runs until `release.yml`, which
      # has no such line, gated a tag on it. Tests that do not gate are a
      # report nobody reads.
      - name: Run tests
        run: npm test
        env:
          # The install matrix (installMatrix.test.ts: ~100 s and ~20 npm
          # installs on Linux) runs on one cell only, ubuntu-latest + Node 22;
          # every other cell skips it, and the suite says so. On windows-latest
          # both cells hung for 40+ minutes in this step with it (cause not
          # established), so Windows is not covered by it in CI.
          SKIP_INSTALL_MATRIX: ${{ (matrix.os == 'ubuntu-latest' && matrix.node-version == 22) && 'false' || 'true' }}

      # **macOS + Node 24: `npm test` dies on SIGSEGV now and then** — exit 139,
      # at a different test file each time (seen from 2026-10-03, on main and
      # on branches), and a rerun passes. Jest says nothing because the process
      # is gone, so the only record is the system's crash report. These two
      # steps put its summary (process, parent, signal, faulting thread) in the
      # log and keep the full reports as an artifact.
      - name: Summarise macOS crash reports
        if: failure() && runner.os == 'macOS'
        run: |
          sw_vers
          # Only reports written during this job: the image ships older ones
          # (a JetsamEvent from when it was built), which say nothing here.
          # The report lands a few seconds after the crash (measured: 6 s), so
          # this step, which starts at once, waits for it — up to 30 s.
          mkdir -p "$RUNNER_TEMP/crash-reports"
          for i in 1 2 3 4 5 6; do
            find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -name '*.ips' -newer package.json \
              -exec cp {} "$RUNNER_TEMP/crash-reports/" \; 2>/dev/null || true
            files=$(ls "$RUNNER_TEMP"/crash-reports/*.ips 2>/dev/null || true)
            [ -n "$files" ] && break
            sleep 5
          done
          if [ -z "$files" ]; then echo "no crash report written"; exit 0; fi
          node scripts/ci/ips-summary.cjs $files

      - name: Keep macOS crash reports
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: crash-reports-node${{ matrix.node-version }}
          path: ${{ runner.temp }}/crash-reports/*.ips
          if-no-files-found: ignore
          retention-days: 14

      # These six packages' tests run in the root `npm test` above (one shared
      # Jest configuration, its roots name every package); only their types are
      # checked here, each against its own tsconfig.test.json. Since 19.2.0 the
      # transports' launch code and its suites live in server-runtime; server,
      # http and sse keep the test of their own entry points.
      - name: Type-check server-runtime tests
        run: npm --prefix server-runtime run test:check

      - name: Type-check server tests
        run: npm --prefix server run test:check

      - name: Type-check http tests
        run: npm --prefix http run test:check

      - name: Type-check sse tests
        run: npm --prefix sse run test:check

      - name: Type-check background-runs-memory tests
        run: npm --prefix background-runs-memory run test:check

      - name: Type-check responsible-rules tests
        run: npm --prefix responsible-rules run test:check

      # Any known advisory of moderate severity or above fails the run, dev
      # dependencies included: they run here and on every developer's machine.
      - name: Security audit (moderate+)
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: npm audit --audit-level=moderate

      # All eighteen packages. 10.0.0 split them: the repository root is
      # `@mcp-abap-adt/lib` and `server/` is `@mcp-abap-adt/core`, which is the
      # one carrying the `mcp-abap-adt` binary. `npm pack` at the root produces
      # `mcp-abap-adt-lib-*.tgz`, so the install step below looked for a file
      # this job had never created and failed on every run since the split.
      # 14.0.0 added `compact`, `compact-readonly` (since 19.0.0
      # `compact-readonly-entries`) and `compact-modify`, which
      # this step did not pack — a compact package that could not be created
      # or installed reached the release unseen. `http` and `sse` are packages
      # of their own, not `core`'s dependencies; they are packed so that every
      # package of the release is created and installed here, and so that the
      # install asks the registry for none of the release's own packages.
      # 19.2.0 added `server-runtime`, which every binary package depends on:
      # without its tarball here the install would take it from the registry.
      - name: Verify the packages can be created
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: |
          npm pack
          npm pack ./background-runs-memory ./responsible-rules ./compact-readonly-entries ./compact-modify ./server-runtime ./http ./sse ./server ./compact ./compact-http ./compact-sse ./core-ro ./http-ro ./sse-ro ./compact-ro ./compact-http-ro ./compact-sse-ro

      # **Both tarballs in one install, or this step cannot pass a release.**
      # `core` depends on `lib` by range, so installing the core tarball alone
      # sends npm to the registry for `@mcp-abap-adt/lib@^11.0.0` — a version
      # that does not exist yet, because publishing happens after this.
      # `ETARGET: No matching version found` is the shape of that, and it is
      # guaranteed on any pull request that raises the major. Naming both as
      # top-level requests lets the sibling tarball satisfy the range, which
      # is also the arrangement a consumer ends up with once both are on npm.
      #
      # Installed locally rather than globally: a global install needs the
      # runner's permissions for nothing this check is about, and the point is
      # that the binary the package declares runs at all.
      - name: Test package installation (Unix)
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: |
          mkdir -p /tmp/install-check && cd /tmp/install-check
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "$GITHUB_WORKSPACE"/mcp-abap-adt-*.tgz
          # **Did `core` accept the `lib` we just built, or fetch another
          # one?** Not "are the versions equal" — they need not be, and this
          # repository has shipped lib 10.1.0 and 10.2.0 against an unchanged
          # core 10.0.1. What must not happen is `core` silently resolving a
          # DIFFERENT lib from the registry because its declared range does
          # not accept ours: the install still succeeds, the binary still
          # runs, and nobody is told. npm shows it in the tree — a dependency
          # a top-level package cannot satisfy is installed nested under the
          # one that wanted it.
          #
          # Measured both ways before this was written: core requiring
          # `^11.0.0` beside lib 11.0.0 leaves no nested copy, and the same
          # core requiring `^10.0.0` pulls lib 10.2.0 into
          # `core/node_modules/`.
          #
          # `readFileSync`, not `require`: a package's `exports` map does not
          # offer `./package.json`, so requiring that subpath is
          # ERR_PACKAGE_PATH_NOT_EXPORTED.
          # The same question for every sibling a package of this repository
          # depends on, or takes as a peer (lib, background-runs-memory and
          # responsible-rules are peers of the packages below the binaries): a
          # nested copy is one the registry supplied instead.
          node -e "const {readFileSync,existsSync}=require('node:fs');
            const nm='node_modules/@mcp-abap-adt/';
            const pkg=n=>JSON.parse(readFileSync(nm+n+'/package.json','utf8'));
            const ours=['lib','background-runs-memory','responsible-rules','server-runtime','http','sse','core','compact','compact-http','compact-sse','compact-readonly-entries','compact-modify','core-ro','http-ro','sse-ro','compact-ro','compact-http-ro','compact-sse-ro'];
            let bad=0;
            for (const p of ours) for (const [d,range] of Object.entries({...pkg(p).peerDependencies,...pkg(p).dependencies})) {
              const n=d.replace('@mcp-abap-adt/','');
              if (!ours.includes(n)) continue;
              if (existsSync(nm+p+'/node_modules/@mcp-abap-adt/'+n)) {
                console.error(p+' did not accept the '+n+' built here ('+pkg(n).version+'): its range is '+range+', and npm nested another copy.');
                bad=1;
              }
            }
            if (bad) process.exit(1);
            console.log(ours.map(p=>p+' '+pkg(p).version).join(', ')+': every sibling is the one built here');"
          # The twelve bins: each answers its version and its help.
          for bin in mcp-abap-adt mcp-abap-adt-http mcp-abap-adt-sse \
            mcp-abap-adt-compact mcp-abap-adt-compact-http mcp-abap-adt-compact-sse \
            mcp-abap-adt-ro mcp-abap-adt-http-ro mcp-abap-adt-sse-ro \
            mcp-abap-adt-compact-ro mcp-abap-adt-compact-http-ro mcp-abap-adt-compact-sse-ro; do
            ./node_modules/.bin/$bin --version
            ./node_modules/.bin/$bin --help
          done

      # **Every image, from this run's tarballs.** One Dockerfile builds the
      # twelve variants (`VARIANT`); with `PACKAGE_SOURCE=tarballs` it installs
      # the checkout's packages, so the images are this run's code and not
      # whatever npm holds — a release raising the major could not be built
      # from the registry before it is published. Each image is checked:
      # every package of the release in it came from its tarball (and
      # server-runtime is among them), `--version`, a `tools/list`; HTTP and
      # SSE also the health endpoint, the image's HEALTHCHECK and a
      # `tools/call` whose x-sap-* credential reaches an ADT stand-in; a `-ro`
      # image lists no write tool.
      - name: Build and check the Docker images
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          cp mcp-abap-adt-*.tgz "$RUNNER_TEMP/tarballs/"
          node scripts/ci/check-images.mjs --tarballs "$RUNNER_TEMP/tarballs" --tag ci

      # The Glama reference image installs `core` from npm at its pinned
      # version, which is on npm only once the release is published: it is
      # built when it can be, and the run says so when it cannot.
      - name: Build the Glama reference image
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: |
          version=$(sed -n 's/^ARG CORE_VERSION=//p' docker/Dockerfile.inspect)
          if [ -z "$(npm view "@mcp-abap-adt/core@$version" version 2>/dev/null)" ]; then
            echo "@mcp-abap-adt/core@$version is not on npm yet: Dockerfile.inspect not built"
            exit 0
          fi
          docker build -f docker/Dockerfile.inspect -t mcp-abap-adt-test/inspect:ci docker
          docker run --rm mcp-abap-adt-test/inspect:ci mcp-abap-adt --version
          docker image rm mcp-abap-adt-test/inspect:ci
