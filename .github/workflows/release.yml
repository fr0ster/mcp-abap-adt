name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.1.0, v1.2.3, etc.

permissions:
  contents: write  # Required for creating releases

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Biome lint
        run: npx biome check src --diagnostic-level=error

      # The root step covers `src` only; core, http, sse and the two compact
      # packages over HTTP lint their own sources.
      - name: Run Biome lint (server)
        run: npm --prefix server run lint:check

      - name: Run Biome lint (http)
        run: npm --prefix http run lint:check

      - name: Run Biome lint (sse)
        run: npm --prefix sse run lint:check

      - name: Run Biome lint (background-runs-memory)
        run: npm --prefix background-runs-memory run lint:check

      - name: Run Biome lint (responsible-rules)
        run: npm --prefix responsible-rules run lint:check

      # Their suites run in the root `npm test` (its Jest roots name them).
      - name: Run Biome lint (compact-http)
        run: npm --prefix compact-http run lint:check

      - name: Run Biome lint (compact-sse)
        run: npm --prefix compact-sse run lint:check

      # The six read-only packages (C23); their suites run in the root
      # `npm test` (its Jest roots name them).
      - name: Run Biome lint (core-ro)
        run: npm --prefix core-ro run lint:check

      - name: Run Biome lint (http-ro)
        run: npm --prefix http-ro run lint:check

      - name: Run Biome lint (sse-ro)
        run: npm --prefix sse-ro run lint:check

      - name: Run Biome lint (compact-ro)
        run: npm --prefix compact-ro run lint:check

      - name: Run Biome lint (compact-http-ro)
        run: npm --prefix compact-http-ro run lint:check

      - name: Run Biome lint (compact-sse-ro)
        run: npm --prefix compact-sse-ro run lint:check

      - name: Build project
        run: npm run build

      # The build compiles `src` without the tests, and Jest strips types
      # without checking them, so a test that does not type-check still runs
      # green. This step is the only place its types are checked.
      - name: Type-check tests
        run: npm run test:check

      - name: Run tests
        run: npm test

      # The server package's own tests: the root Jest's roots are `src` and
      # `compact*`, so `server/src/__tests__` never ran in CI before.
      - name: Type-check server tests
        run: npm --prefix server run test:check

      - name: Run server tests
        run: npm --prefix server test

      # The HTTP package's own tests, beside core's.
      - name: Type-check http tests
        run: npm --prefix http run test:check

      - name: Run http tests
        run: npm --prefix http test

      # The SSE package's own tests, beside http's.
      - name: Type-check sse tests
        run: npm --prefix sse run test:check

      - name: Run sse tests
        run: npm --prefix sse test

      # The in-memory background-run store's own tests.
      - name: Type-check background-runs-memory tests
        run: npm --prefix background-runs-memory run test:check

      - name: Run background-runs-memory tests
        run: npm --prefix background-runs-memory test

      # The responsible rules' own tests.
      - name: Type-check responsible-rules tests
        run: npm --prefix responsible-rules run test:check

      - name: Run responsible-rules tests
        run: npm --prefix responsible-rules test

  release:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## Installation

            ```bash
            npm install @mcp-abap-adt/core
            ```

            See [Installation Guide](https://github.com/${{ github.repository }}/blob/main/docs/installation/INSTALLATION.md) for details.

            ## What's Changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
