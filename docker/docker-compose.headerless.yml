# MCP ABAP ADT Server - Header-based authentication only
#
# This configuration expects all authentication parameters to be passed
# via HTTP headers in each request. No service keys or sessions needed.
#
# Required headers for each request:
# - x-sap-url: SAP system URL
# and
# - x-sap-jwt-token: a JWT you hold (used as it is; the server cannot renew it)
# OR
# - x-sap-login: Username (for basic auth)
# - x-sap-password: Password (for basic auth)
#
# Usage: docker-compose -f docker-compose.headerless.yml up -d

services:
  mcp-abap-adt:
    # Installs the published packages from npm; nothing of the checkout goes in.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MCP_ABAP_ADT_VERSION: ${MCP_ABAP_ADT_VERSION:-latest}
    image: mcp-abap-adt:headerless
    container_name: mcp-abap-adt-headerless
    restart: unless-stopped

    # HTTP transport for client connections
    ports:
      - "3000:3000"

    # Minimal environment - no destination needed
    environment:
      - NODE_ENV=production
      - MCP_HTTP_PORT=3000
      - MCP_HTTP_HOST=0.0.0.0

    # No destinations: x-mcp-destination is not honoured here
    command: ["mcp-abap-adt"]

    # No volumes needed - all auth via headers

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

    # Healthcheck
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/mcp/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
