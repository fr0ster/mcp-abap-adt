# MCP ABAP ADT Server installed from the npm tarballs in docker/packages/
#
# Before building, pack the server there (from the repository root):
#   npm run docker:pack        # the published @mcp-abap-adt/core
# or a build of the checkout (lib and core together) — see docker/README.package.md
#
# Usage (from the repository root): npm run docker:build:package && npm run docker:up:package

services:
  mcp-abap-adt:
    build:
      context: ..
      dockerfile: docker/Dockerfile.package
    image: mcp-abap-adt:package
    container_name: mcp-abap-adt-server
    restart: unless-stopped

    # HTTP transport for client connections
    ports:
      - "3000:3000"

    # Environment configuration
    environment:
      - NODE_ENV=production
      - MCP_HTTP_PORT=3000
      - MCP_HTTP_HOST=0.0.0.0

      # Base directory of service-keys/ and sessions/ inside the container
      - AUTH_BROKER_PATH=/app
    # The destination is chosen by the command, not by an environment variable
    # (--mcp=<name> for an own default, --allow-destination-header for x-mcp-destination)
    #   --mcp=<destination>         a default destination: service-keys/<destination>.json
    command: ["mcp-abap-adt", "--transport=http", "--allow-destination-header"]

    # Volumes for the destinations
    volumes:
      # Service keys directory - put your {destination}.json files here
      - ./service-keys:/app/service-keys:ro

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Healthcheck
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/mcp/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
