version: '3.8'

# MCP ABAP ADT Server using npm package tarball
#
# Before building, put exactly ONE @mcp-abap-adt/core tarball in docker/packages/
# (a root 'npm pack' makes the @mcp-abap-adt/lib tarball, which has no server):
#   npm pack @mcp-abap-adt/core@<version> --pack-destination docker/packages
# See docker/README.package.md
#
# Usage: docker-compose -f docker-compose.package.yml up -d

services:
  mcp-abap-adt:
    build:
      context: ..
      dockerfile: docker/Dockerfile.package
    image: mcp-abap-adt:package
    container_name: mcp-abap-adt-server
    restart: unless-stopped

    # HTTP transport for client connections
    ports:
      - "3000:3000"

    # Environment configuration
    environment:
      - NODE_ENV=production
      - MCP_HTTP_PORT=3000
      - MCP_HTTP_HOST=0.0.0.0

      # Base directory of service-keys/ and sessions/ inside the container
      - AUTH_BROKER_PATH=/app
    # The destination is chosen by the command, not by an environment variable
    # (--mcp=<name> for an own default, --allow-destination-header for x-mcp-destination)
    command: ["node", "./bin/mcp-abap-adt.js", "--transport", "http", "--mcp=trial", "--allow-destination-header"]

    # Volumes for the destinations
    volumes:
      # Service keys directory - put your {destination}.json files here
      - ./service-keys:/app/service-keys:ro

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Healthcheck
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/mcp/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
