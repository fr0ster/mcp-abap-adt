version: '3.8'

# MCP ABAP ADT Server with destination-based authentication
#
# Architecture:
# - A destination is a service key (and optionally a session file)
# - Service keys stored in volume (./service-keys)
# - HTTP transport on port 3000

services:
  mcp-abap-adt:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: mcp-abap-adt-server
    restart: unless-stopped

    # HTTP transport for client connections
    ports:
      - "3000:3000"

    # Environment configuration
    environment:
      - NODE_ENV=production
      - MCP_HTTP_PORT=3000
      - MCP_HTTP_HOST=0.0.0.0

      # Base directory of service-keys/ and sessions/ inside the container.
      # One directory (a list is not split): set it, or the server reads the home directory's.
      - AUTH_BROKER_PATH=/app
    # The destination is chosen by the command, not by an environment variable:
    #   --mcp=<name>                an own default destination (service-keys/<name>.json)
    #   --allow-destination-header  a client names it per request with x-mcp-destination
    # (the image's default command is --allow-destination-header alone)
    command: ["node", "./dist/server/launcher.js", "--mcp=trial", "--allow-destination-header"]

    # Volumes for AuthBroker data
    volumes:
      # Service keys directory - put your {destination}.json files here
      # Example: ./service-keys/trial.json, ./service-keys/dev.json
      - ./service-keys:/app/service-keys:ro

      # Sessions: written only with --unsafe (otherwise the session is kept in memory)
      # - ./sessions:/app/sessions

      # Optional: Cache directory
      # - ./cache:/app/cache

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Healthcheck
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
