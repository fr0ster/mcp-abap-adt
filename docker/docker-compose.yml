# One service per server variant, each the image docker/Dockerfile builds for
# it from npm (nothing of the checkout goes in). Every service has a profile of
# its own name, so a bare `up` starts nothing: name the variant.
#
#   Streamable HTTP and SSE — credentials only from x-sap-* headers:
#     docker compose -f docker/docker-compose.yml up -d http
#     curl http://localhost:3000/mcp/health        (SSE variants: port 3001)
#
#   stdio — a named destination from ./service-keys and ./sessions:
#     docker compose -f docker/docker-compose.yml run --rm -T core --mcp=<name>
#
# The system type is required and never guessed: set SAP_SYSTEM_TYPE (onprem,
# cloud or legacy) in the shell or in docker/.env; it is passed to every
# service as it is.

x-build: &build
  context: .
  dockerfile: Dockerfile

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# stdio: run on demand with stdin open; the service keys read-only, the
# sessions writable (written only with --unsafe).
x-stdio: &stdio
  stdin_open: true
  environment:
    - SAP_SYSTEM_TYPE
  volumes:
    - ./service-keys:/app/service-keys:ro
    - ./sessions:/app/sessions
  logging: *logging

# Streamable HTTP on 3000; the image listens on 0.0.0.0 and checks its health. Published on the
# host's loopback only — put TLS in front, or change the mapping, to reach it from elsewhere.
x-http: &http
  restart: unless-stopped
  ports:
    - "127.0.0.1:3000:3000"
  environment:
    - SAP_SYSTEM_TYPE
  logging: *logging

# HTTP+SSE on 3001, the SSE binary's own port.
x-sse: &sse
  restart: unless-stopped
  ports:
    - "127.0.0.1:3001:3001"
  environment:
    - SAP_SYSTEM_TYPE
  logging: *logging

services:
  core:
    <<: *stdio
    profiles: ["core"]
    build: { <<: *build, args: { VARIANT: core, MCP_ABAP_ADT_VERSION: "${MCP_ABAP_ADT_VERSION:-latest}" } }
    image: mcp-abap-adt/core

  compact:
    <<: *stdio
    profiles: ["compact"]
    build: { <<: *build, args: { VARIANT: compact, MCP_ABAP_ADT_VERSION: "${MCP_ABAP_ADT_VERSION:-latest}" } }
    image: mcp-abap-adt/compact

  core-ro:
    <<: *stdio
    profiles: ["core-ro"]
    build: { <<: *build, args: { VARIANT: core-ro, MCP_ABAP_ADT_VERSION: "${MCP_ABAP_ADT_VERSION:-latest}" } }
    image: mcp-abap-adt/core-ro

  compact-ro:
    <<: *stdio
    profiles: ["compact-ro"]
    build: { <<: *build, args: { VARIANT: compact-ro, MCP_ABAP_ADT_VERSION: "${MCP_ABAP_ADT_VERSION:-latest}" } }
    image: mcp-abap-adt/compact-ro

  http:
    <<: *http
    profiles: ["http"]
    build: { <<: *build, args: { VARIANT: http, MCP_ABAP_ADT_VERSION: "${MCP_ABAP_ADT_VERSION:-latest}" } }
    image: mcp-abap-adt/http

  compact-http:
    <<: *http
    profiles: ["compact-http"]
    build: { <<: *build, args: { VARIANT: compact-http, MCP_ABAP_ADT_VERSION: "${MCP_ABAP_ADT_VERSION:-latest}" } }
    image: mcp-abap-adt/compact-http

  http-ro:
    <<: *http
    profiles: ["http-ro"]
    build: { <<: *build, args: { VARIANT: http-ro, MCP_ABAP_ADT_VERSION: "${MCP_ABAP_ADT_VERSION:-latest}" } }
    image: mcp-abap-adt/http-ro

  compact-http-ro:
    <<: *http
    profiles: ["compact-http-ro"]
    build: { <<: *build, args: { VARIANT: compact-http-ro, MCP_ABAP_ADT_VERSION: "${MCP_ABAP_ADT_VERSION:-latest}" } }
    image: mcp-abap-adt/compact-http-ro

  sse:
    <<: *sse
    profiles: ["sse"]
    build: { <<: *build, args: { VARIANT: sse, MCP_ABAP_ADT_VERSION: "${MCP_ABAP_ADT_VERSION:-latest}" } }
    image: mcp-abap-adt/sse

  compact-sse:
    <<: *sse
    profiles: ["compact-sse"]
    build: { <<: *build, args: { VARIANT: compact-sse, MCP_ABAP_ADT_VERSION: "${MCP_ABAP_ADT_VERSION:-latest}" } }
    image: mcp-abap-adt/compact-sse

  sse-ro:
    <<: *sse
    profiles: ["sse-ro"]
    build: { <<: *build, args: { VARIANT: sse-ro, MCP_ABAP_ADT_VERSION: "${MCP_ABAP_ADT_VERSION:-latest}" } }
    image: mcp-abap-adt/sse-ro

  compact-sse-ro:
    <<: *sse
    profiles: ["compact-sse-ro"]
    build: { <<: *build, args: { VARIANT: compact-sse-ro, MCP_ABAP_ADT_VERSION: "${MCP_ABAP_ADT_VERSION:-latest}" } }
    image: mcp-abap-adt/compact-sse-ro
